schemaVersion: 1
updated: "2026-08-29"
policy:
  standalone:
    pinTags: true
    digestLockRequired: false
  production:
    pinTags: true
    digestLockRequired: true
components:
  kubernetes:
    version: "1.36.1"
    image: "kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5"
    scope: standalone-runtime
    source: "https://kubernetes.io/releases/"
  kind:
    version: "0.31.0"
    scope: standalone-bootstrap
    source: "https://kind.sigs.k8s.io/"
  postgres:
    version: "18.6"
    image: "postgres:18.6"
    scope: standalone-metadata-and-demo-source
    productionReplacement: "managed PostgreSQL or HA PostgreSQL"
    source: "https://www.postgresql.org/docs/release/18.6/"
  postgresJdbc:
    version: "42.7.13"
    artifact: "org.postgresql:postgresql:42.7.13"
    sha256: "6e0e4cc2d8cae902084f8a2b18728b073a6fd9d1f87c9d8bff8f298c18185b93"
    scope: jdbc-ingestion
    source: "https://github.com/pgjdbc/pgjdbc/releases/tag/REL42.7.13"
  garage:
    version: "2.3.0"
    image: "dxflrs/garage:v2.3.0"
    scope: standalone-object-storage
    productionReplacement: "cloud-native object storage or production-supported S3-compatible storage"
    source: "https://garagehq.deuxfleurs.fr/"
  kafka:
    version: "4.3.1"
    image: "apache/kafka:4.3.1"
    scope: event-streaming
    source: "https://kafka.apache.org/community/downloads/"
  polaris:
    version: "1.7.0"
    image: "apache/polaris:1.7.0"
    adminImage: "apache/polaris-admin-tool:1.7.0"
    scope: iceberg-rest-catalog
    source: "https://polaris.apache.org/releases/1.7.0/"
  iceberg:
    version: "1.11.0"
    sparkRuntimeArtifact: "org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0"
    awsBundleArtifact: "org.apache.iceberg:iceberg-aws-bundle:1.11.0"
    scope: table-format
    source: "https://iceberg.apache.org/releases/"
  spark:
    version: "4.1.3"
    image: "apache/spark:4.1.3-python3"
    standaloneImage: "odp/spark-iceberg:4.1.3-iceberg1.11.0"
    scope: batch-and-stream-processing
    compatibilityReason: "Iceberg 1.11.0 officially maintains Spark 4.1 integration; Spark 4.2 is not yet listed as supported."
    source: "https://spark.apache.org/downloads"
  trino:
    version: "483"
    image: "trinodb/trino:483"
    scope: analytical-serving
    source: "https://trino.io/docs/current/release.html"
  airflow:
    version: "3.3.1"
    image: "apache/airflow:3.3.1"
    standaloneImage: "odp/airflow-orchestrator:3.3.1-k8s10.21.1"
    scope: orchestration
    source: "https://airflow.apache.org/docs/apache-airflow/stable/release_notes.html"
  airflowKubernetesProvider:
    version: "10.21.1"
    package: "apache-airflow-providers-cncf-kubernetes==10.21.1"
    scope: kubernetes-job-orchestration
    source: "https://airflow.apache.org/docs/apache-airflow-providers-cncf-kubernetes/stable/index.html"
  opentelemetryCollector:
    version: "0.159.0"
    image: "otel/opentelemetry-collector-contrib:0.159.0"
    scope: telemetry-ingress
    source: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases"
  prometheus:
    version: "3.13.2"
    image: "prom/prometheus:v3.13.2"
    supportLine: "3.13 LTS"
    scope: standalone-metrics-backend
    source: "https://prometheus.io/docs/introduction/release-cycle/"
  grafana:
    version: "13.1.3"
    image: "grafana/grafana:13.1.3"
    scope: standalone-observability-ui
    source: "https://grafana.com/grafana/download"
applications:
  batchOrders:
    version: "0.1.0"
    image: "odp/batch-orders:0.1.0"
    runtime: "odp/spark-iceberg:4.1.3-iceberg1.11.0"
    scope: golden-path-batch
