apiVersion: odp/v1alpha2
kind: DataContract
metadata:
  name: orders
  owner: ecommerce-data
spec:
  schema:
    - name: order_id
      type: string
      nullable: false
      classification: internal
    - name: amount
      type: decimal(18,2)
      nullable: false
      classification: confidential
  quality:
    - name: order_id_not_null
      type: not_null
      column: order_id
      severity: error
      action: quarantine
    - name: order_id_unique
      type: unique
      column: order_id
      severity: error
      action: quarantine
    - name: amount_non_negative
      type: range
      column: amount
      min: 0
      severity: error
      action: quarantine
