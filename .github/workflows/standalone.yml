name: Standalone Integration

on:
  pull_request:
    paths:
      - ".github/workflows/standalone.yml"
      - "config/versions.yaml"
      - "deployment/kubernetes/**"
      - "infrastructure/environments/local/**"
      - "platform/processing/spark/**"
      - "platform/orchestration/airflow/**"
      - "examples/golden-paths/**"
      - "scripts/build-local-images.sh"
      - "scripts/local-up.sh"
      - "scripts/local-secrets.sh"
      - "scripts/smoke-test.sh"
      - "scripts/lakehouse-smoke-test.sh"
      - "scripts/batch-golden-path-test.sh"
      - "scripts/airflow-batch-test.sh"
      - "scripts/cdc-golden-path-test.sh"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: standalone-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.32.0
          config: infrastructure/environments/local/kind-config.yaml
          cluster_name: odp-local
      - name: Install validation dependency
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml
      - name: Bootstrap standalone platform
        run: |
          make validate
          ./scripts/local-up.sh
      - name: Platform smoke test
        run: make smoke-test
      - name: Batch golden path direct execution
        run: make batch-golden-path-test
      - name: Batch golden path via Airflow
        run: make airflow-batch-test
      - name: CDC golden path
        run: make cdc-golden-path-test
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get jobs -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -200 || true
          kubectl -n odp-data get jobs,pvc -o wide || true
          kubectl -n odp-data describe pods || true
          kubectl -n odp-system describe pods || true
          kubectl -n odp-system describe job/polaris-bootstrap || true
          kubectl -n odp-system logs job/polaris-bootstrap --all-containers=true --tail=300 || true
          kubectl -n odp-system describe job/polaris-catalog-setup || true
          kubectl -n odp-system logs job/polaris-catalog-setup --all-containers=true --tail=300 || true
          kubectl -n odp-data logs deployment/postgres --tail=200 || true
          kubectl -n odp-data logs deployment/kafka --tail=200 || true
          kubectl -n odp-data logs deployment/debezium-connect --tail=300 || true
          kubectl -n odp-data logs deployment/cdc-orders --tail=300 || true
          kubectl -n odp-system logs deployment/polaris --tail=300 || true
          kubectl -n odp-data logs deployment/trino --tail=200 || true
          kubectl -n odp-system logs deployment/airflow --tail=300 || true
          kubectl -n odp-data logs job/cdc-orders-connector-setup --all-containers=true --tail=300 || true
