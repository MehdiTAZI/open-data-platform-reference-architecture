name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with: {version: v1.36.1}
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
      - name: Validate repository
        run: make validate

  spark-application-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build compatibility-locked Spark/Iceberg image
        run: |
          docker build \
            --build-arg SPARK_IMAGE=apache/spark:4.1.3-python3 \
            --build-arg ICEBERG_VERSION=1.11.0 \
            --build-arg POSTGRES_JDBC_VERSION=42.7.13 \
            --build-arg POSTGRES_JDBC_SHA256=6e0e4cc2d8cae902084f8a2b18728b073a6fd9d1f87c9d8bff8f298c18185b93 \
            -t odp/spark-iceberg:ci platform/processing/spark
      - name: Verify runtime artifacts
        run: |
          docker run --rm --entrypoint /bin/bash odp/spark-iceberg:ci -ec '
            test -f /opt/spark/jars/iceberg-spark-runtime-4.1_2.13-1.11.0.jar
            test -f /opt/spark/jars/iceberg-aws-bundle-1.11.0.jar
            test -f /opt/spark/jars/postgresql-42.7.13.jar
            /opt/spark/bin/spark-submit --version
          '
      - name: Build batch application
        run: |
          docker build --build-arg RUNTIME_IMAGE=odp/spark-iceberg:ci -t odp/batch-orders:ci examples/golden-paths/batch-orders
          docker run --rm --entrypoint python3 odp/batch-orders:ci -m py_compile /opt/odp/jobs/batch-orders/batch_orders.py
      - name: Build CDC application
        run: |
          docker build --build-arg RUNTIME_IMAGE=odp/spark-iceberg:ci -t odp/cdc-orders:ci examples/golden-paths/cdc-orders
          docker run --rm --entrypoint /bin/bash odp/cdc-orders:ci -ec '
            test -f /opt/spark/jars/spark-sql-kafka-0-10_2.13-4.1.3.jar
            test -f /opt/spark/jars/spark-token-provider-kafka-0-10_2.13-4.1.3.jar
            test -f /opt/spark/jars/kafka-clients-3.9.2.jar
            test -f /opt/spark/jars/lz4-java-1.10.3.jar
            test -f /opt/spark/jars/zstd-jni-1.5.6-4.jar
            test -f /opt/spark/jars/snappy-java-1.1.10.5.jar
            test -f /opt/spark/jars/commons-pool2-2.12.1.jar
            test "$(find /opt/spark/jars -maxdepth 1 -name "kafka-clients-*.jar" | wc -l)" -eq 1
            test "$(find /opt/spark/jars -maxdepth 1 -name "lz4-java-*.jar" | wc -l)" -eq 1
            test "$(find /opt/spark/jars -maxdepth 1 -name "zstd-jni-*.jar" | wc -l)" -eq 1
            test "$(find /opt/spark/jars -maxdepth 1 -name "snappy-java-*.jar" | wc -l)" -eq 1
            test "$(find /opt/spark/jars -maxdepth 1 -name "commons-pool2-*.jar" | wc -l)" -eq 1
            test "$(find /opt/spark/jars -maxdepth 1 -name "scala-library-*.jar" | wc -l)" -eq 1
            test -f /opt/spark/jars/scala-library-2.13.17.jar
            test "$(find /opt/spark/jars -maxdepth 1 -name "hadoop-client-runtime-*.jar" | wc -l)" -le 1
            python3 -m py_compile /opt/odp/jobs/cdc-orders/cdc_orders.py
          '
      - name: Verify standalone Debezium image tag
        run: docker pull quay.io/debezium/connect:3.6.1.Final

  airflow-orchestration-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Airflow orchestration image
        run: |
          docker build \
            --build-arg AIRFLOW_IMAGE=apache/airflow:3.3.1 \
            --build-arg AIRFLOW_VERSION=3.3.1 \
            --build-arg KUBERNETES_PROVIDER_VERSION=10.21.1 \
            -f platform/orchestration/airflow/Dockerfile -t odp/airflow-orchestrator:ci .
      - name: Validate provider and DAG import
        run: |
          docker run --rm --entrypoint /bin/bash odp/airflow-orchestrator:ci -ec '
            pip check
            python -m py_compile /opt/airflow/dags/batch_orders_snapshot.py
            python - <<"PY"
          import runpy
          from airflow.providers.cncf.kubernetes.operators.job import KubernetesJobOperator
          namespace = runpy.run_path("/opt/airflow/dags/batch_orders_snapshot.py")
          assert namespace["dag"].dag_id == "batch_orders_snapshot"
          assert isinstance(namespace["run_batch_orders"], KubernetesJobOperator)
          PY
          '

  standalone-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.32.0
          config: infrastructure/environments/local/kind-config.yaml
          cluster_name: odp-local
      - name: Create platform namespaces first
        run: kubectl apply -f deployment/kubernetes/base/namespaces.yaml
      - name: Validate platform manifests
        run: kubectl apply --dry-run=server -k deployment/kubernetes/standalone >/dev/null
      - name: Validate golden-path manifests
        run: |
          kubectl apply --dry-run=server -f examples/golden-paths/batch-orders/kubernetes/job.yaml >/dev/null
          kubectl apply --dry-run=server -f examples/golden-paths/cdc-orders/kubernetes/connector-setup.yaml >/dev/null
          kubectl apply --dry-run=server -f examples/golden-paths/cdc-orders/kubernetes/streaming.yaml >/dev/null
      - name: Validate Airflow RBAC boundary
        run: |
          kubectl apply -k deployment/kubernetes/standalone >/dev/null
          kubectl auth can-i create jobs.batch -n odp-data --as=system:serviceaccount:odp-system:airflow-orchestrator | grep -qx yes
          kubectl auth can-i get pods/log -n odp-data --as=system:serviceaccount:odp-system:airflow-orchestrator | grep -qx yes
          kubectl auth can-i get secrets -n odp-data --as=system:serviceaccount:odp-system:airflow-orchestrator | grep -qx no
          kubectl auth can-i update deployments.apps -n odp-data --as=system:serviceaccount:odp-system:airflow-orchestrator | grep -qx no
      - name: Validate baseline policies
        run: |
          kubectl apply -f deployment/kubernetes/base/default-deny.yaml
          kubectl get namespace odp-system odp-data odp-observability
