name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
      - name: Validate repository
        run: make validate

  standalone-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.31.0
          config: infrastructure/environments/local/kind-config.yaml
          cluster_name: odp-local
      - name: Create platform namespaces first
        run: kubectl apply -f deployment/kubernetes/base/namespaces.yaml
      - name: Validate standalone manifests against Kubernetes API
        run: kubectl apply --dry-run=server -k deployment/kubernetes/standalone >/dev/null
      - name: Validate baseline policies
        run: |
          kubectl apply -f deployment/kubernetes/base/default-deny.yaml
          kubectl get namespace odp-system odp-data odp-observability
