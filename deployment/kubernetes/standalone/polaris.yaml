apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-bootstrap
  namespace: odp-system
  labels:
    app.kubernetes.io/name: polaris-bootstrap
    app.kubernetes.io/part-of: odp
spec:
  backoffLimit: 8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polaris-bootstrap
        app.kubernetes.io/part-of: odp
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      initContainers:
        - name: wait-postgres
          image: postgres:18.6
          command: ["/bin/sh", "-ec"]
          args:
            - until pg_isready -h postgres.odp-data.svc.cluster.local -p 5432 -U "$DB_USER" -d polaris; do sleep 2; done
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: polaris-db-credentials, key: username}}
          securityContext: {allowPrivilegeEscalation: false}
        - name: render-bootstrap-credentials
          image: busybox:1.37.0
          command: ["/bin/sh", "-ec"]
          args:
            - printf 'odp,root,%s\n' "$POLARIS_ROOT_SECRET" > /bootstrap/credentials.txt; chmod 600 /bootstrap/credentials.txt
          env:
            - name: POLARIS_ROOT_SECRET
              valueFrom: {secretKeyRef: {name: polaris-root-credentials, key: client-secret}}
          volumeMounts:
            - {name: bootstrap-credentials, mountPath: /bootstrap}
          securityContext: {allowPrivilegeEscalation: false}
      containers:
        - name: bootstrap
          image: apache/polaris-admin-tool:1.7.0
          args: ["bootstrap", "--credentials-file=/bootstrap/credentials.txt"]
          env:
            - {name: POLARIS_PERSISTENCE_TYPE, value: relational-jdbc}
            - {name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://postgres.odp-data.svc.cluster.local:5432/polaris"}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: polaris-db-credentials, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: polaris-db-credentials, key: password}}
          volumeMounts:
            - {name: bootstrap-credentials, mountPath: /bootstrap, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false}
      volumes:
        - {name: bootstrap-credentials, emptyDir: {medium: Memory}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  namespace: odp-system
  labels:
    app.kubernetes.io/name: polaris
    app.kubernetes.io/part-of: odp
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: polaris}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polaris
        app.kubernetes.io/part-of: odp
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-bootstrap-schema
          image: postgres:18.6
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until PGPASSWORD="$DB_PASSWORD" psql \
                -h postgres.odp-data.svc.cluster.local -U "$DB_USER" -d polaris \
                -tAc "SELECT to_regclass('polaris_schema.entities')" | grep -q polaris_schema.entities; do
                sleep 2
              done
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: polaris-db-credentials, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: polaris-db-credentials, key: password}}
          securityContext: {allowPrivilegeEscalation: false}
      containers:
        - name: polaris
          image: apache/polaris:1.7.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: POLARIS_PERSISTENCE_TYPE, value: relational-jdbc}
            - {name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://postgres.odp-data.svc.cluster.local:5432/polaris"}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: polaris-db-credentials, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: polaris-db-credentials, key: password}}
            - {name: POLARIS_REALM_CONTEXT_REALMS, value: "odp"}
            - {name: POLARIS_REALM_CONTEXT_REQUIRE_HEADER, value: "false"}
            - {name: AWS_REGION, value: "garage"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: polaris-storage-credentials, key: access-key}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: polaris-storage-credentials, key: secret-key}}
          ports:
            - {name: api, containerPort: 8181}
            - {name: management, containerPort: 8182}
          startupProbe:
            httpGet: {path: /q/health/started, port: management}
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe: {httpGet: {path: /q/health/ready, port: management}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /q/health/live, port: management}, initialDelaySeconds: 30, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1536Mi}
          securityContext: {allowPrivilegeEscalation: false}
---
apiVersion: v1
kind: Service
metadata:
  name: polaris
  namespace: odp-system
spec:
  selector: {app.kubernetes.io/name: polaris}
  ports:
    - {name: api, port: 8181, targetPort: api}
    - {name: management, port: 8182, targetPort: management}
