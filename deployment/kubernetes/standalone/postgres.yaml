apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: odp-data
data:
  001-create-polaris.sql: |
    CREATE DATABASE polaris;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: odp-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: odp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: odp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: password}
            - name: POSTGRES_DB
              value: platform
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: odp-data
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
