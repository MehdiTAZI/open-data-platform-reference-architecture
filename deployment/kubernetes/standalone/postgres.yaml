apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: odp-data
data:
  001-create-polaris.sql: |
    CREATE DATABASE polaris;
  010-source-orders.sql: |
    CREATE SCHEMA IF NOT EXISTS source;
    CREATE TABLE IF NOT EXISTS source.orders (
      order_id BIGINT PRIMARY KEY,
      customer_id VARCHAR(32) NOT NULL,
      order_ts TIMESTAMP NOT NULL,
      status VARCHAR(16) NOT NULL,
      amount NUMERIC(18,2) NOT NULL CHECK (amount >= 0),
      country CHAR(2) NOT NULL
    );
    INSERT INTO source.orders (order_id, customer_id, order_ts, status, amount, country) VALUES
      (1001, 'C001', TIMESTAMP '2026-08-25 10:15:00', 'COMPLETED', 120.50, 'MA'),
      (1002, 'C002', TIMESTAMP '2026-08-25 11:00:00', 'COMPLETED', 80.00, 'FR'),
      (1003, 'C001', TIMESTAMP '2026-08-25 12:30:00', 'CANCELLED', 45.25, 'MA'),
      (1004, 'C003', TIMESTAMP '2026-08-26 09:00:00', 'COMPLETED', 200.00, 'ES'),
      (1005, 'C004', TIMESTAMP '2026-08-26 15:45:00', 'COMPLETED', 150.00, 'MA'),
      (1006, 'C002', TIMESTAMP '2026-08-26 17:20:00', 'PENDING', 90.00, 'FR')
    ON CONFLICT (order_id) DO UPDATE SET
      customer_id = EXCLUDED.customer_id,
      order_ts = EXCLUDED.order_ts,
      status = EXCLUDED.status,
      amount = EXCLUDED.amount,
      country = EXCLUDED.country;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: odp-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: odp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: odp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=4
            - -c
            - max_wal_senders=4
            - -c
            - max_slot_wal_keep_size=512MB
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: password}
            - name: POSTGRES_DB
              value: platform
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: init, configMap: {name: postgres-init}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: odp-data
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
