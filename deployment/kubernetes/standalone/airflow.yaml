apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-orchestrator
  namespace: odp-system
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/part-of: odp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-batch-job-launcher
  namespace: odp-data
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-batch-job-launcher
  namespace: odp-data
subjects:
  - kind: ServiceAccount
    name: airflow-orchestrator
    namespace: odp-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-batch-job-launcher
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: odp-system
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/part-of: odp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/part-of: odp
    spec:
      serviceAccountName: airflow-orchestrator
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 50000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: airflow
          image: odp/airflow-orchestrator:3.3.1-k8s10.21.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - exec airflow standalone
          env:
            - {name: AIRFLOW_HOME, value: /opt/airflow/local}
            - {name: AIRFLOW__CORE__DAGS_FOLDER, value: /opt/airflow/dags}
            - {name: AIRFLOW__CORE__LOAD_EXAMPLES, value: "False"}
            - {name: AIRFLOW__CORE__EXECUTOR, value: "LocalExecutor"}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /api/v2/version, port: http}
            failureThreshold: 90
            periodSeconds: 3
          readinessProbe:
            httpGet: {path: /api/v2/version, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v2/version, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: airflow-home, mountPath: /opt/airflow/local}
      volumes:
        - {name: airflow-home, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: odp-system
spec:
  selector:
    app.kubernetes.io/name: airflow
  ports:
    - {name: http, port: 8080, targetPort: http}
