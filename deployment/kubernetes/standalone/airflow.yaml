apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: odp-system
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/part-of: odp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/part-of: odp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: airflow
          image: apache/airflow:3.3.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - exec airflow standalone
          env:
            - {name: AIRFLOW__CORE__LOAD_EXAMPLES, value: "False"}
            - {name: AIRFLOW__CORE__EXECUTOR, value: "LocalExecutor"}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /api/v2/version, port: http}
            failureThreshold: 90
            periodSeconds: 3
          readinessProbe:
            httpGet: {path: /api/v2/version, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v2/version, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 640Mi}
            limits: {cpu: "2", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: airflow-home, mountPath: /opt/airflow}
      volumes:
        - {name: airflow-home, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: odp-system
spec:
  selector:
    app.kubernetes.io/name: airflow
  ports:
    - {name: http, port: 8080, targetPort: http}
