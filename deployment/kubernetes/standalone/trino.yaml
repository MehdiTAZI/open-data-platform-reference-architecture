apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: odp-data
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
    query.max-memory=512MB
  jvm.config: |
    -server
    -Xmx768M
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+ExitOnOutOfMemoryError
  node.properties: |
    node.environment=standalone
    node.id=odp-trino
    node.data-dir=/var/trino/data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: odp-data
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/part-of: odp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino
        app.kubernetes.io/part-of: odp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: trino
          image: trinodb/trino:483
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /v1/info, port: http}
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /v1/info, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /v1/info, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: config, mountPath: /etc/trino/config.properties, subPath: config.properties, readOnly: true}
            - {name: config, mountPath: /etc/trino/jvm.config, subPath: jvm.config, readOnly: true}
            - {name: config, mountPath: /etc/trino/node.properties, subPath: node.properties, readOnly: true}
            - {name: data, mountPath: /var/trino/data}
      volumes:
        - name: config
          configMap: {name: trino-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: odp-data
spec:
  selector:
    app.kubernetes.io/name: trino
  ports:
    - {name: http, port: 8080, targetPort: http}
