apiVersion: batch/v1
kind: Job
metadata:
  name: batch-orders
  namespace: odp-data
  labels:
    app.kubernetes.io/name: batch-orders
    app.kubernetes.io/part-of: odp
    odp.io/golden-path: batch
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-orders
        app.kubernetes.io/part-of: odp
        odp.io/golden-path: batch
        odp.io/kubernetes-api-client: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: spark
      containers:
        - name: driver
          image: odp/batch-orders:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - |
              exec /opt/spark/bin/spark-submit \
                --master k8s://https://kubernetes.default.svc \
                --deploy-mode client \
                --name odp-batch-orders \
                --conf spark.kubernetes.namespace=odp-data \
                --conf spark.kubernetes.authenticate.driver.serviceAccountName=spark \
                --conf spark.kubernetes.container.image=odp/spark-iceberg:4.1.3-iceberg1.11.0 \
                --conf spark.kubernetes.container.image.pullPolicy=IfNotPresent \
                --conf spark.executor.instances=1 \
                --conf spark.executor.cores=1 \
                --conf spark.executor.memory=512m \
                --conf spark.driver.host="${POD_IP}" \
                --conf spark.driver.bindAddress=0.0.0.0 \
                local:///opt/odp/jobs/batch-orders/batch_orders.py
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: POLARIS_CLIENT_ID, value: root}
            - name: POLARIS_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: polaris-client-credentials, key: client-secret}}
            - name: GARAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: garage-credentials, key: access-key}}
            - name: GARAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: garage-credentials, key: secret-key}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: password}}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
