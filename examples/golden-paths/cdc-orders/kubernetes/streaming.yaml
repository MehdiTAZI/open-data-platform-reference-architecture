apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cdc-orders-checkpoint
  namespace: odp-data
  labels:
    app.kubernetes.io/name: cdc-orders
    odp.io/golden-path: cdc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-orders
  namespace: odp-data
  labels:
    app.kubernetes.io/name: cdc-orders
    app.kubernetes.io/part-of: odp
    odp.io/golden-path: cdc
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cdc-orders}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cdc-orders
        app.kubernetes.io/part-of: odp
        odp.io/golden-path: cdc
        odp.io/kubernetes-api-client: "true"
    spec:
      serviceAccountName: spark
      securityContext:
        fsGroup: 185
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-cdc-topic
          image: apache/kafka:4.3.1
          command: ["/bin/bash", "-ec"]
          args:
            - until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.odp-data.svc.cluster.local:9092 --describe --topic odp.source.orders >/dev/null 2>&1; do sleep 3; done
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
          securityContext: {allowPrivilegeEscalation: false}
      containers:
        - name: driver
          image: odp/cdc-orders:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - |
              rm -f /tmp/odp-cdc-ready
              exec /opt/spark/bin/spark-submit \
                --master k8s://https://kubernetes.default.svc \
                --deploy-mode client \
                --name odp-cdc-orders \
                --conf spark.kubernetes.namespace=odp-data \
                --conf spark.kubernetes.authenticate.driver.serviceAccountName=spark \
                --conf spark.kubernetes.container.image=odp/cdc-orders:0.1.0 \
                --conf spark.kubernetes.container.image.pullPolicy=IfNotPresent \
                --conf spark.executor.instances=1 \
                --conf spark.executor.cores=1 \
                --conf spark.executor.memory=640m \
                --conf spark.driver.host="${POD_IP}" \
                --conf spark.driver.bindAddress=0.0.0.0 \
                local:///opt/odp/jobs/cdc-orders/cdc_orders.py
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: CDC_TOPIC, value: "odp.source.orders"}
            - {name: CHECKPOINT_LOCATION, value: "file:///var/lib/odp/checkpoints/orders-cdc"}
            - {name: POLARIS_CLIENT_ID, value: root}
            - name: POLARIS_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: polaris-client-credentials, key: client-secret}}
            - name: GARAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: garage-credentials, key: access-key}}
            - name: GARAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: garage-credentials, key: secret-key}}
          readinessProbe:
            exec: {command: ["/bin/bash", "-ec", "test -f /tmp/odp-cdc-ready"]}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec: {command: ["/bin/bash", "-ec", "test -f /tmp/odp-cdc-ready && kill -0 1"]}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 2304Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: checkpoint, mountPath: /var/lib/odp/checkpoints}
      volumes:
        - name: checkpoint
          persistentVolumeClaim: {claimName: cdc-orders-checkpoint}
